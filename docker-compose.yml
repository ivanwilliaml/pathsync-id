# Local / single-host deployment: PostgreSQL + FastAPI backend + Next.js frontend.
#   docker compose up --build      -> http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pathsync
      POSTGRES_PASSWORD: pathsync
      POSTGRES_DB: pathsync
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathsync"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PATHSYNC_DATABASE_URL: postgresql+psycopg://pathsync:pathsync@db:5432/pathsync
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [hf:/app/.hf]
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args: {PATHSYNC_API: "http://backend:8000"}
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  hf:
