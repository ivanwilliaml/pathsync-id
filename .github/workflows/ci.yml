# Continuous integration: lint + tests for the backend, typecheck + production build for the frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PATHSYNC_TEST_REDIS_URL: redis://localhost:6379/0
      PATHSYNC_WARMUP: "0"
      PATHSYNC_EXTRACTOR: lexicon
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Python dependencies have no known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/pathsync/config.py') }}
      - name: Build the demo database (market map + expert study)
        run: |
          python -m pipeline.build_market --extractor lexicon --ref 2026-10-06
          python -m pipeline.expert_study
      - name: Migrations apply cleanly on a fresh database and match the models
        run: |
          PATHSYNC_DATABASE_URL=sqlite:///./ci-fresh.db python -c "from pathsync.db import init_db; init_db(); init_db()"
          PATHSYNC_DATABASE_URL=sqlite:///./ci-fresh.db python -m pathsync.migrate check
      - name: Tests (coverage of pathsync/ and api/ must stay at 80% or more)
        run: python -m pytest -q --cov=pathsync --cov=api --cov-report=term --cov-fail-under=80

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathsync
          POSTGRES_PASSWORD: pathsync
          POSTGRES_DB: pathsync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathsync" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PATHSYNC_WARMUP: "0"
      PATHSYNC_EXTRACTOR: lexicon
      HF_HOME: ~/.cache/huggingface
      PATHSYNC_DATABASE_URL: postgresql+psycopg://pathsync:pathsync@localhost:5432/pathsync
      PATHSYNC_TEST_DATABASE_URL: postgresql+psycopg://pathsync:pathsync@localhost:5432/pathsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/pathsync/config.py') }}
      - name: Upgrade head from an empty database, then compare models and migrations
        run: |
          python -m pathsync.migrate
          python -m pathsync.migrate
          python -m pathsync.migrate check
      - name: Build the demo database (market map + expert study)
        run: |
          python -m pipeline.build_market --extractor lexicon --ref 2026-10-06
          python -m pipeline.expert_study
      - name: Tests on PostgreSQL
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
