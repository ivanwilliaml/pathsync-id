# Monthly scrape check (paper III.A.6, trigger 2). Production scrapes on the server itself (compose service
# `market-refresh`, pipeline.scheduled_refresh); this workflow only proves the scrapers still work and keeps the
# snapshot as a build artifact for 90 days. It no longer commits raw postings to git: the history would grow every
# month and the raw text is third-party content whose reuse terms are still under review (docs/ops/DATA_SOURCES.md).
name: Scraping bulanan

on:
  schedule:
    - cron: "0 1 1 * *"        # 08:00 WIB on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27" "beautifulsoup4>=4.12" "lxml>=5.0"
      - name: Karirhub Kemnaker
        run: python -m scrapers.karirhub
      - name: ATS publik
        run: python -m scrapers.ats
      - name: Count new postings
        run: |
          for f in $(git ls-files --others --exclude-standard data/raw); do echo "$f: $(wc -l < "$f") postings"; done
      - name: Keep the snapshot as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-postings-${{ github.run_id }}
          path: backend/data/raw/*_*.jsonl
          retention-days: 90
